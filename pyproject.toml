[project]
name = "asistente-viajes"
version = "0.1.0"
description = "Agente de viajes con tool use, structured outputs, evals y MCP (práctica)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
